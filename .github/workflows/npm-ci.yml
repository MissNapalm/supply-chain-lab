name: npm-build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: host-mac
    env:
      CI_DEPLOY_TOKEN: ${{ secrets.CI_DEPLOY_TOKEN }}
      LAB_HOST: "127.0.0.1"
      LAB_PORT: "4444"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: victim-app
        run: |
          npm install

      - name: App runs fine
        working-directory: victim-app
        run: |
          node -e "console.log('app output: build complete')"
